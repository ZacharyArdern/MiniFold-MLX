[build-system]
requires = ["setuptools >= 61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "minifoldx"
version = "0.2.0"
description = "MiniFoldX — protein structure prediction on Apple Silicon (MLX) or Google Colab (CUDA)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # All pure-MLX/numpy — no PyTorch required for inference.
    # ESM2 is vendored in minifold_mlx/esm2/.
    "mlx >= 0.16.0",
    "numpy",
    "tqdm",
    "modelcif",         # PDB output (protein.py)
    "dm-tree",          # residue_constants dependency
    "huggingface_hub",  # weight download
    "biopython",        # protein.py
]

[project.optional-dependencies]
colab = [
    "click",            # minifold-colab CLI
]
dev = [
    "pytest",
    "ruff",
]

[project.scripts]
minifoldx = "minifold_mlx._dispatch:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools.package-data]
minifold_mlx = [
    "utils/stereo_chemical_props.txt",
    "esm2/*.py",
]

# ── Usage notes ───────────────────────────────────────────────────────────────
#
# Install (local development):
#   uv pip install -e .
#
# Install from GitHub (once public):
#   uv pip install git+https://github.com/ZacharyArdern/MiniFoldX
#
# Quick start:
#   from minifold_mlx import load_model, predict_batch, get_of_config
#
#   tokenizer, model = load_model(
#       mlx_esm_path      = "path/to/checkpoints/mlx-esm2_t36_3B_UR50D_finetuned",
#       mlx_minifold_path = "path/to/minifold_mlx_48L",
#   )
#   results = predict_batch(
#       [("prot1", "MKVL..."), ("prot2", "MSYL...")],
#       model, tokenizer,
#   )
#   # results = {"prot1": "<PDB string>", "prot2": "<PDB string>"}
